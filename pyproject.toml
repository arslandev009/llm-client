[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-client"
version = "0.1.0"
description = "Provider-agnostic OpenAI-format LLM client (OpenAI, Groq, Gemini, local llama.cpp)"
requires-python = ">=3.11"
dependencies = ["openai>=1.40", "pydantic>=2.5", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
